<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>ОИБАС-26 — расписание</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: #f3f4f6;
  color: #111827;
}
header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(10px);
  padding: 16px 14px 12px;
  border-bottom: 1px solid #e5e7eb;
}
h1 { margin: 0; font-size: 22px; }
.sub { color: #6b7280; font-size: 13px; margin-top: 4px; }
button {
  width: 100%; margin-top: 12px; padding: 12px;
  border: 0; border-radius: 12px;
  background: #111827; color: white;
  font-size: 16px; font-weight: 600;
}
button:disabled { opacity: .6; }
#status { margin: 12px 14px; }
.status {
  background: white; border-radius: 12px; padding: 11px 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
  font-size: 14px;
}
.error { color: #b91c1c; }
main { padding: 0 12px 28px; }
.day {
  background: white; border-radius: 16px; margin: 12px 0;
  overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.06);
}
.day-title {
  padding: 14px; font-size: 18px; font-weight: 750;
  background: #eef2ff;
}
.lesson { padding: 13px 14px; border-top: 1px solid #eef0f2; }
.time { font-size: 14px; font-weight: 750; color: #374151; }
.subject { margin-top: 4px; font-size: 16px; line-height: 1.35; }
.meta { margin-top: 6px; font-size: 13px; color: #6b7280; line-height: 1.4; }
.empty { padding: 20px; text-align: center; color: #6b7280; }
.badge {
  display: inline-block; margin-left: 6px; padding: 2px 7px;
  border-radius: 999px; background: #f3f4f6; color: #4b5563;
  font-size: 12px; font-weight: 600;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body>
<header>
  <h1>📚 ОИБАС-26</h1>
  <div class="sub">КИТ-ОИБАС-26 · 35 студентов</div>
  <button id="refresh">🔄 Обновить расписание</button>
</header>

<div id="status"><div class="status">Загрузка…</div></div>
<main id="schedule"></main>

<script>
const PUBLIC_URL = "https://disk.360.yandex.ru/i/bfF89K1c0tsG3g";
const GROUP_RE = /ОИБАС-26/i;
const REFRESH_EVERY_MS = 5 * 60 * 1000;

const DAY_ORDER = [
  "Понедельник", "Вторник", "Среда", "Четверг",
  "Пятница", "Суббота", "Воскресенье"
];

const $ = id => document.getElementById(id);

function clean(v) {
  return String(v ?? "").replace(/\u00a0/g, " ").trim();
}

function cleanSubject(v) {
  let s = clean(v);
  // Убираем технические даты действия предмета, но оставляем название.
  s = s.replace(/\s+(?:с\d{6}(?:до\d{6})?|до\d{6})\s*$/i, "");
  s = s.replace(/\s{2,}/g, " ").trim();
  return s;
}

function cleanType(v) {
  return clean(v);
}

function isEmpty(v) {
  const s = clean(v);
  return !s || /^[-–—]$/.test(s);
}

function parseDateAndDay(title) {
  const t = clean(title);
  const m = t.match(/(\d{1,2})\s+([А-Яа-яЁё]+)\s+(\d{4}).*?-\s*([А-Яа-яЁё]+)/i);
  if (!m) return { label: t || "Дата" };

  const months = {
    января:0, февраля:1, марта:2, апреля:3, мая:4, июня:5,
    июля:6, августа:7, сентября:8, октября:9, ноября:10, декабря:11
  };
  const month = months[m[2].toLowerCase()];
  const d = month === undefined ? null : new Date(Number(m[3]), month, Number(m[1]));
  const dateText = d ? d.toLocaleDateString("ru-RU", {day:"numeric", month:"long"}) : `${m[1]} ${m[2]}`;
  const day = m[4].charAt(0).toUpperCase() + m[4].slice(1).toLowerCase();
  return { label: `${day}, ${dateText}` };
}

async function getDownloadUrl() {
  const api =
    "https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=" +
    encodeURIComponent(PUBLIC_URL);

  const r = await fetch(api, { cache: "no-store" });
  if (!r.ok) throw new Error("Яндекс Диск не вернул ссылку на файл.");
  const data = await r.json();
  if (!data.href) throw new Error("Не удалось получить ссылку на XLSX.");
  return data.href;
}

async function getWorkbook() {
  const url = await getDownloadUrl();
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("Не удалось скачать Расписание.xlsx.");
  const buffer = await r.arrayBuffer();
  return XLSX.read(buffer, { type: "array" });
}

function parseSheet(ws) {
  const rows = XLSX.utils.sheet_to_json(ws, {
    header: 1, defval: "", raw: false
  });

  if (!rows.length) return null;

  const title = clean(rows[0]?.[0]);
  const dateInfo = parseDateAndDay(title);

  let groupRow = -1;
  for (let i = 0; i < rows.length; i++) {
    const first = clean(rows[i]?.[0]);
    if (GROUP_RE.test(first)) {
      groupRow = i;
      break;
    }
  }
  if (groupRow < 0) return null;

  const lessons = [];
  let currentTime = "";

  // После строки группы идут заголовки и 6 строк времени.
  for (let i = groupRow + 2; i < rows.length; i++) {
    const row = rows[i];
    const first = clean(row?.[0]);
    const timeCell = clean(row?.[1]);
    const subject = cleanSubject(row?.[2]);
    const type = cleanType(row?.[3]);
    const teacher = clean(row?.[4]);
    const room = clean(row?.[5]);

    // Следующая группа — конец блока.
    if (i > groupRow + 2 && /^(КИТ-|ОИБАС-|ИССС-|ТОИ-|[А-ЯЁ-]+-\d)/i.test(first)) {
      break;
    }

    if (timeCell && /^\d{1,2}:\d{2}\s*-\s*\d{1,2}:\d{2}$/.test(timeCell)) {
      currentTime = timeCell;
    }

    if (isEmpty(subject)) continue;

    // Иногда в Excel время указано только в первой строке пары.
    lessons.push({
      time: currentTime || "Время не указано",
      subject,
      type,
      teacher,
      room
    });
  }

  return {
    label: dateInfo.label,
    sheet: ws,
    lessons
  };
}

function render(days) {
  const root = $("schedule");
  root.innerHTML = "";

  if (!days.length || !days.some(x => x.lessons.length)) {
    root.innerHTML = '<div class="day"><div class="empty">Занятий для ОИБАС-26 не найдено.</div></div>';
    return;
  }

  const sorted = [...days].sort((a,b) => {
    const ai = DAY_ORDER.findIndex(d => a.label.startsWith(d));
    const bi = DAY_ORDER.findIndex(d => b.label.startsWith(d));
    return ai - bi;
  });

  for (const day of sorted) {
    if (!day.lessons.length) continue;

    const block = document.createElement("section");
    block.className = "day";

    const title = document.createElement("div");
    title.className = "day-title";
    title.textContent = day.label;
    block.appendChild(title);

    for (const lesson of day.lessons) {
      const item = document.createElement("article");
      item.className = "lesson";

      const time = document.createElement("div");
      time.className = "time";
      time.textContent = lesson.time;

      const subject = document.createElement("div");
      subject.className = "subject";
      subject.textContent = lesson.subject;

      if (lesson.type) {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = lesson.type;
        subject.appendChild(badge);
      }

      const meta = document.createElement("div");
      meta.className = "meta";

      const parts = [];
      if (lesson.teacher) parts.push("👤 " + lesson.teacher);
      if (lesson.room) parts.push("📍 " + lesson.room);
      meta.textContent = parts.join("  ·  ");

      item.append(time, subject, meta);
      block.appendChild(item);
    }

    root.appendChild(block);
  }
}

async function loadSchedule() {
  const btn = $("refresh");
  const status = $("status");
  btn.disabled = true;
  status.innerHTML = '<div class="status">⏳ Получаю актуальный XLSX с Яндекс Диска…</div>';

  try {
    const wb = await getWorkbook();
    const days = [];

    for (const name of wb.SheetNames) {
      const parsed = parseSheet(wb.Sheets[name]);
      if (parsed) days.push(parsed);
    }

    render(days);

    const now = new Date().toLocaleString("ru-RU");
    status.innerHTML = `<div class="status">✅ Обновлено: ${now}</div>`;
  } catch (e) {
    console.error(e);
    status.innerHTML =
      `<div class="status error">❌ ${escapeHtml(e.message)}<br><br>` +
      `Если Яндекс не разрешает запрос из браузера, скажи мне — сделаем вариант через небольшой сервер-посредник.</div>`;
  } finally {
    btn.disabled = false;
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
  }[c]));
}

$("refresh").addEventListener("click", loadSchedule);
loadSchedule();
setInterval(loadSchedule, REFRESH_EVERY_MS);
</script>
</body>
</html>
